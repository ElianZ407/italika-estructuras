name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate native platform scaffolding
        run: flutter create . --project-name=italika_estructuras --platforms=android --org=com.italika

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Italika-Estructuras-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Italika Estructuras v1.0.0 (APK Android)
          body: |
            📲 **Descarga directa de la App Android**:
            - Guarda el archivo `app-release.apk` en tu teléfono e instálalo directamente.
            - Funciona 100% offline sin necesidad de navegador.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
